name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Get release version
        id: package
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          if [ "$TAG" = "$VERSION" ] || [ -z "$VERSION" ]; then
            echo "Release tags must use the v{version} format. Current tag: $TAG"
            exit 1
          fi

          PROJECT_VERSION=$(grep -oPm1 "(?<=<PackageVersion>)[^<]+" src/CacheManager/CacheManager.csproj)
          if [ -z "$PROJECT_VERSION" ]; then
            PROJECT_VERSION=$(grep -oPm1 "(?<=<Version>)[^<]+" src/CacheManager/CacheManager.csproj)
          fi

          if [ "$PROJECT_VERSION" != "$VERSION" ]; then
            echo "Tag version ($VERSION) must match project package version ($PROJECT_VERSION)."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore src/CacheManager.sln

      - name: Build
        run: dotnet build src/CacheManager.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/CacheManager.sln --configuration Release --no-build --no-restore

      - name: Pack
        run: dotnet pack src/CacheManager/CacheManager.csproj --configuration Release --no-build --no-restore -p:PackageVersion=${{ steps.package.outputs.version }} -o ./artifacts

      - name: Upload package as artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.package.outputs.tag }}
          generate_release_notes: true
          files: ./artifacts/*.nupkg
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to NuGet.org
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish to GitHub Packages
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key "${{ secrets.GITHUB_TOKEN }}" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --skip-duplicate
